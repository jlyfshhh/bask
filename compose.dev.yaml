# Build Bask from this checkout instead of pulling the published image.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
#
# Overriding `image` too keeps a locally built container from being mistaken for
# the published one, so a later `docker compose pull` cannot quietly replace
# your build with whatever is on the registry.
services:
  bask:
    build: .
    image: bask-local:dev
  bask-scanner:
    build: .
    image: bask-local:dev
  # The one-shot init runs the same code as the other two and must be the same
  # locally built image, or a build would mix a fresh web/scanner with whatever
  # published init image the registry last served.
  bask-init:
    build: .
    image: bask-local:dev
