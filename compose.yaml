services:
  bask:
    # A prebuilt multi-architecture image, so installing is a pull rather than a
    # build on the target machine. To build from this checkout instead:
    #   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
    image: ghcr.io/jlyfshhh/bask:${BASK_TAG:-latest}
    container_name: bask
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The network-facing web service has no Bluetooth or host-D-Bus mount and
    # runs as the installing user's numeric UID/GID. The isolated scanner has
    # a different, explicitly documented runtime identity below.
    user: "${BASK_UID:-10001}:${BASK_GID:-10001}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${BASK_WEB_MEMORY_LIMIT:-512m}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=0700
    env_file:
      - .env
    environment:
      BASK_DATA_DIR: /data
      BASK_ROLE: web
    ports:
      - "${BASK_BIND_ADDRESS:-0.0.0.0}:${BASK_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BASK_DATA_PATH:-./data}:/data

  bask-scanner:
    image: ghcr.io/jlyfshhh/bask:${BASK_TAG:-latest}
    container_name: bask-scanner
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Root, and that is deliberate — do not "harden" this back to a normal user.
    # Passive BLE scanning goes through BlueZ's AdvertisementMonitor1 D-Bus
    # interface, and the policy BlueZ ships grants that interface to root only.
    # A non-root client is refused during D-Bus authentication, which surfaces
    # as "[Errno 104] Connection reset by peer" and no readings at all. Adding a
    # local D-Bus policy for an unprivileged uid does not fix it.
    #
    # The isolation that matters is still intact: the web service above is
    # non-root with a read-only root filesystem and no D-Bus socket, so nothing
    # reachable through Bask's HTTP port can talk to the host bus. The scanner
    # has no network stack or published ports; it can read the host bus through
    # the mounted socket and write scanner state only through /data.
    user: "0:0"
    # Dropping every capability also drops CAP_DAC_OVERRIDE, without which even
    # root cannot write a /data directory owned by another uid.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    # Runtime state is written only to the separate /data bind mount; the
    # scanner image filesystem itself stays immutable.
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${BASK_SCANNER_MEMORY_LIMIT:-256m}
    network_mode: none
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=0700
    env_file:
      - .env
    environment:
      BASK_DATA_DIR: /data
      BASK_ROLE: scanner
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/var/run/dbus/system_bus_socket
    volumes:
      - ${BASK_DATA_PATH:-./data}:/data
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    healthcheck:
      disable: true
