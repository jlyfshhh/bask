name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Shell syntax
        run: bash -n get-bask.sh deploy/install.sh docker-entrypoint.sh scripts/backup.sh
      - name: Python compile and data-path smoke test
        run: |
          python -m py_compile server/app.py scanner/*.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/smoke.py
      - name: Container build
        run: docker build -t bask:test .
