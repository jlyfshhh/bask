name: Test

on:
  push:
  pull_request:
  # Publication depends on this workflow, so a red build cannot ship an image.
  workflow_call:
    secrets:
      PRIVACY_DENYLIST:
        description: Private identities to reject; stored only as a repository secret
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Shell syntax
        run: bash -n get-bask.sh deploy/install.sh docker-entrypoint.sh scripts/backup.sh scripts/privacy-scan.sh tests/installer.sh tests/backup.sh tests/privacy-scan.sh tests/compose-contract.sh tests/apparmor-profile.sh
      - name: Privacy scan behavior
        run: bash tests/privacy-scan.sh
      - name: Privacy scan
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PRIVACY_SCAN_STRICT: ${{ (github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '0' || '1' }}
        run: bash scripts/privacy-scan.sh
      - name: Standalone installer rollback and backup safety
        run: |
          bash tests/installer.sh
          bash tests/backup.sh
      # Real Docker, unlike the suite above, which fakes it. Catches how Compose
      # actually resolves a shipped compose.yaml on a first install.
      - name: Compose contract (real Docker)
        run: bash tests/compose-contract.sh
      # ubuntu-latest runs AppArmor, which is the only place the scanner's D-Bus
      # denial exists. Debian and Raspberry Pi OS cannot exercise this at all.
      - name: AppArmor profile (real AppArmor host)
        run: bash tests/apparmor-profile.sh
      - name: Python compile and data-path smoke test
        run: |
          python -m py_compile server/*.py scanner/*.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/smoke.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_cielo.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_vesync.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_keeper.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_keeper_throttle.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_keeper_api.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_alerts.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_response_security.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_config_concurrency.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_import_schema.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_render_escaping.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_hostile_advert.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_scanner_limits.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_room_status.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_range_window.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_container_boundary.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_climate_log.py
          PYTHONPATH="$PWD:$PWD/scanner" python tests/test_thermostat_units.py
          node tests/test_frontend_concurrency.js
          node tests/test_accessibility.js
          node tests/test_solar_settings.js
      - name: Container build
        run: docker build -t bask:test .
