name: Publish container image

# Bask builds far more cheaply than Shed does — a pip install, no bundler — but
# publishing it keeps both apps installing the same way: pull a prebuilt image
# rather than build one on whatever board the keeper happens to own.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # An image must never be published from a build that did not pass. This
  # repository shipped one on 2026-08-08 (bask c3d944d) while its tests were
  # red, because publication and testing were separate workflows with no
  # relationship. Calling the real suite keeps the two from drifting apart.
  verify:
    uses: ./.github/workflows/test.yml
    # Without this the called workflow gets no secrets, and the privacy scan
    # would quietly downgrade to "unconfigured" on the path that publishes.
    secrets: inherit

  # One native runner per architecture. Building arm64 under QEMU works but
  # takes the better part of an hour for an npm install plus a bundler; native
  # arm64 runners are free for public repositories and finish in minutes.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The digest arrives as sha256:abc…, and a colon is not allowed in an
          # artifact path. Store the bare hex; the manifest step puts the
          # sha256: back when it references them.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # Both architectures then go behind one tag, so `docker compose up` pulls the
  # right one automatically and nobody has to know their board's architecture.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create and push the manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest"
